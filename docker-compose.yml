services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goodeva_desk
    ports:
      - "5432:5432"
    volumes:
      - goodeva-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d goodeva_desk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - goodeva-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/goodeva_desk?schema=public
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: 604800
      CACHE_SIMILARITY_THRESHOLD: "0.85"
      CACHE_SIMILARITY_MAX_ENTRIES: "100"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Utilitas NLP satu kali. Aktifkan dengan: docker compose --profile nlp run --rm nlp ...
  nlp:
    profiles: ["nlp"]
    build:
      context: ./python
    env_file:
      - .env
    environment:
      GOODEVA_API_URL: http://api:3000
      GOODEVA_API_KEY: ${GOODEVA_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  goodeva-postgres:
  goodeva-redis:
